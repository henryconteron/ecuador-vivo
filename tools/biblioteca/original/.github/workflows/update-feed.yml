name: Actualizar feed geológico

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * *"

permissions:
  contents: write

concurrency:
  group: update-geological-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar OpenAlex
        run: python scripts/update_feed.py
      - name: Validar catálogo
        run: python -m json.tool data/posts.json > /dev/null
      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/posts.json; then
            echo "No hay publicaciones nuevas."
            exit 0
          fi
          git config user.name "geopulso-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json
          git commit -m "data: actualizar publicaciones geológicas"
          git push
