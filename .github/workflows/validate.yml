name: Validate atlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: pnpm run check
      - run: python scripts/validate_geojson_schemas.py
      - run: node scripts/prepare_napo_river_sample.mjs --check
      - run: node scripts/promote_napo_river_sample.mjs --help
      - run: python -m pip install -r requirements-landcover.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/fetch_catalog_inputs.py --help
      - run: python scripts/build_fault_catalog.py --help
      - run: python scripts/build_napo_landcover.py --help
      - run: python scripts/build_napo_imagery.py --help
      - run: python scripts/build_napo_spectral.py --help
      - run: python scripts/build_napo_rivers.py --help
      - run: python scripts/build_napo_river_changes.py --help
      - run: python scripts/build_fluvial_lab.py --help
      - run: python scripts/evaluate_fluvial_methods.py --help
