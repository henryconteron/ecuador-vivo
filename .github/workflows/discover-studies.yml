name: Discover Ecuador studies (review queue)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/discover_ecuador_studies.py
      - uses: actions/upload-artifact@v4
        with:
          name: studies-for-editorial-review
          path: _local/library-candidates.json
          retention-days: 14
