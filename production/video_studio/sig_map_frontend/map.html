<div id="sig-map">
  <div class="tools" role="toolbar" aria-label="Herramientas del mapa">
    <button id="sig-zoom-in" aria-label="Acercar mapa">+</button>
    <button id="sig-zoom-out" aria-label="Alejar mapa">−</button>
    <button id="sig-fit-all">Ajustar capas visibles</button>
    <button id="sig-fit-layer">Ajustar capa activa</button>
    <button id="sig-clear">Limpiar selección</button>
  </div>
  <svg id="sig-geographic-map" role="img" aria-label="Mapa interactivo lon/lat de capas GeoJSON" tabindex="0" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="status"><span id="sig-coordinate">Lon/lat · OGC:CRS84</span><span id="sig-map-status"></span></div>
  <div class="help">Arrastra para desplazar · rueda o +/− para zoom · clic en un polígono para identificar · vista angular, sin medición métrica ni mapa base externo</div>
</div>
