<div class="editor evs" lang="es">
 <header class="topbar" aria-label="Proyecto y reproducción">
  <div class="brand"><span class="brand-mark" aria-hidden="true">EV</span><div>Ecuador Vivo<span>STUDIO</span></div></div>
  <nav class="workspace-navigation" aria-label="Espacios compartidos"><button id="nav-home">Inicio</button><button id="nav-sig">SIG</button><span aria-current="page">Studio</span></nav>
  <label class="sr-only" for="project-name">Nombre del proyecto</label><input id="project-name" maxlength="180" aria-label="Nombre del proyecto">
  <span id="save-state" role="status" aria-live="polite"></span>
  <div class="history-tools"><button id="undo" title="Deshacer · Ctrl+Z" aria-label="Deshacer"></button><button id="redo" title="Rehacer · Ctrl+Mayús+Z" aria-label="Rehacer"></button></div>
  <button id="play" title="Preparar reproducción con audio" aria-label="Reproducir"></button>
  <button id="format" title="Formato y resolución"></button><span id="resolution"></span>
  <button id="export" class="primary">Exportar</button>
  <button id="project-menu" aria-label="Menú del proyecto" title="Proyecto y navegación"></button>
 </header>
 <div class="workspace">
  <aside class="layers-panel" aria-label="Recursos y capas">
   <nav class="resource-nav" aria-label="Biblioteca"><button data-tab="scenes">Escenas</button><button data-tab="layers">Capas</button><button data-tab="media">Multimedia</button><button data-tab="data">Datos</button><button data-tab="templates">Plantillas</button></nav>
   <div class="panel-body"><div class="panel-heading"><h2 id="resource-title">Capas</h2><button id="close-left" class="mobile-only" aria-label="Cerrar recursos">×</button></div>
    <div id="layer-content"><div class="layer-actions"><button id="layerup" title="Subir capa" aria-label="Subir capa"></button><button id="layerdown" title="Bajar capa" aria-label="Bajar capa"></button><button id="group" title="Agrupar · Ctrl+G" aria-label="Agrupar"></button><button id="ungroup" title="Desagrupar" aria-label="Desagrupar"></button></div><div id="layers"></div><p class="panel-note">Mayús + clic para seleccionar varios.</p></div>
    <div id="library-content"></div>
    <div class="library-secondary"><button data-tab="visuals">Visualizaciones</button><button data-tab="project">Proyecto y recuperación</button></div>
   </div>
  </aside>
  <main class="canvas-area" aria-label="Edición visual">
   <div class="canvas-toolbar" role="toolbar" aria-label="Herramientas del lienzo">
    <button id="toggle-left" title="Recursos y capas" aria-label="Mostrar u ocultar recursos"></button>
    <button id="addtext" title="Añadir texto">Texto</button><button id="addshape" title="Añadir forma">Forma</button>
    <div class="view-tools"><label title="Zoom del lienzo"><span class="sr-only">Zoom</span><select id="zoom"><option value="fit">Ajustar</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option><option value="125">125%</option><option value="150">150%</option><option value="200">200%</option></select></label><label><input id="guides" type="checkbox" checked>Guías</label><label><input id="snap" type="checkbox" checked>Snap</label></div>
    <button id="toggle-right" title="Inspector" aria-label="Mostrar u ocultar inspector"></button>
   </div>
   <div class="canvas-heading"><span id="scene-label"></span><span id="canvas-mode">EDICIÓN</span></div>
   <div id="preparation" hidden role="status"><span id="preparation-label"></span><progress id="preparation-progress" max="1" value="0" aria-label="Preparación del video"></progress></div>
   <div class="viewport"><div class="stage" id="canvas-stage" tabindex="0" aria-label="Lienzo editable del video" aria-describedby="keyboard-help"><div class="board"></div></div></div>
   <div class="preview-surface" hidden><video id="movie" playsinline controls></video><img id="frame-preview" alt="Cuadro de la timeline"><button id="back-edit">Volver a editar</button></div>
   <div class="canvas-status"><span id="keyboard-help">Mayús + clic: selección · Flechas: mover · Alt + arrastre: pan</span><span id="pending" role="status" aria-live="polite"></span></div>
  </main>
  <aside class="inspector" aria-label="Inspector contextual">
   <div class="panel-heading"><h2 id="inspector-title">Propiedades</h2><button id="close-right" class="mobile-only" aria-label="Cerrar inspector">×</button></div>
   <div class="inspector-fields">
    <div id="selection-common"><label>Elemento<select id="object"></select></label><label>Nombre de capa<input id="name" maxlength="180"></label><div class="selection-state"><label class="checkbox-label"><input id="locked" type="checkbox">Bloquear</label><button id="delete" title="Eliminar selección" aria-label="Eliminar selección"></button></div>
     <details open><summary>Transformación <span>px</span></summary><div class="coordinates"><label>X<input id="x" type="number" step="1"></label><label>Y<input id="y" type="number" step="1"></label><label>Ancho<input id="w" type="number" min="1"></label><label>Alto<input id="h" type="number" min="1"></label></div></details>
    </div>
    <div id="text-properties"><details open><summary>Contenido</summary><label>Texto<textarea id="text" rows="3" maxlength="2000"></textarea></label><div class="coordinates"><label>Tamaño<input id="font" type="number" min="8" max="400"></label><label>Color<input id="color" type="color"></label></div></details></div>
    <div id="context-fields"></div><p id="hint"></p><p id="notice" role="status"></p>
    <details id="recovery-fields"><summary>Organizar y recuperar</summary><label class="checkbox-label"><input id="hidden" type="checkbox">Ocultar elemento</label><div class="stack"><button id="front">Al frente</button><button id="back">Al fondo</button></div><label>Eliminados<select id="deleted"></select></label><button id="restore">Recuperar elemento</button><button id="duplicate-selection">Duplicar selección</button></details>
   </div>
  </aside>
 </div>
 <section class="timeline" aria-label="Timeline de escenas">
  <div class="timeline-toolbar"><strong>Timeline</strong><span id="total"></span><output id="time"></output><button id="scene-add" title="Añadir escena" aria-label="Añadir escena"></button><button id="scene-duplicate" title="Duplicar escena" aria-label="Duplicar escena"></button><button id="scene-remove" title="Quitar escena de timeline" aria-label="Quitar escena de timeline"></button><label class="time-zoom">Zoom temporal<input id="time-zoom" type="range" min="50" max="250" value="100"></label><button id="timeline-collapse" title="Colapsar timeline" aria-label="Colapsar timeline"></button></div>
  <div class="timeline-content"><div id="time-ruler"></div><div id="scenes" role="list"></div><div id="timeline-playhead" aria-hidden="true"></div><div id="tracks"></div><label class="seek-label"><span class="sr-only">Playhead</span><input id="playhead" aria-label="Playhead" type="range" min="0" step="1"></label></div>
 </section>
 <div class="statusbar"><span>5 · Estudio</span><span id="workspace-status" role="status" aria-live="polite"></span><button id="help">Atajos</button></div>
 <dialog id="workspace-dialog"><header><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Cerrar diálogo">×</button></header><div id="dialog-body"></div></dialog>
 <div hidden><button id="addicon"></button><button id="apply"></button><button id="generate"></button><button id="reset"></button><select id="icon"></select><p class="foot"></p></div>
</div>
