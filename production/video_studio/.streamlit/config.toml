# Ecuador Vivo workbench. Native theme, local fonts, no CDN.
[theme]
base = "dark"
primaryColor = "#15836f"
backgroundColor = "#10171d"
secondaryBackgroundColor = "#17242c"
textColor = "#edf3f5"
linkColor = "#82e4ca"
borderColor = "#718a96"
grayTextColor = "#afc0c9"
blueTextColor = "#abd8ff"
blueBackgroundColor = "#143247"
greenTextColor = "#9de9c7"
greenBackgroundColor = "#173f34"
yellowTextColor = "#ffde95"
yellowBackgroundColor = "#3a3220"
redTextColor = "#ffc2bd"
redBackgroundColor = "#42272b"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Segoe UI, sans-serif"
headingFont = "Segoe UI, sans-serif"
baseFontSize = 16
headingFontSizes = ["2rem", "1.5rem", "1.25rem", "1.125rem", "1rem", "1rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
[theme.sidebar]
backgroundColor = "#10252e"
secondaryBackgroundColor = "#182e38"
textColor = "#f0f4f3"
primaryColor = "#67e0c2"
linkColor = "#82e4ca"
borderColor = "#607b86"
grayTextColor = "#b3c7cd"
blueTextColor = "#abd8ff"
blueBackgroundColor = "#143247"
greenTextColor = "#9de9c7"
greenBackgroundColor = "#173f34"
yellowTextColor = "#ffde95"
yellowBackgroundColor = "#3a3220"
redTextColor = "#ffc2bd"
redBackgroundColor = "#42272b"
headingFontSizes = ["1.5rem", "1.25rem", "1.125rem", "1rem", "1rem", "1rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
[server]
address = "127.0.0.1"
port = 8510
headless = true
maxUploadSize = 512
[browser]
gatherUsageStats = false
